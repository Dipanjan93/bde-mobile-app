<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131e"/>
      <stop offset="50%" stop-color="#0c2338"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cyanGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="360" rx="20" fill="url(#bgGrad4)"/>
  <rect width="800" height="360" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>

  <!-- AR Grid mesh overlay -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <line x1="500" y1="40" x2="780" y2="160"/>
    <line x1="500" y1="120" x2="780" y2="240"/>
    <line x1="500" y1="200" x2="780" y2="320"/>
    <line x1="550" y1="20" x2="520" y2="340"/>
    <line x1="650" y1="20" x2="620" y2="340"/>
    <line x1="750" y1="20" x2="720" y2="340"/>
  </g>

  <circle cx="670" cy="150" r="140" fill="url(#cyanGrad4)" opacity="0.12" filter="url(#glow4)"/>

  <!-- Left Content Column -->
  <rect x="48" y="44" width="220" height="32" rx="16" fill="linear-gradient(90deg, #0284c7, #4f46e5)"/>
  <text x="158" y="65" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">✨ WEBAR CAMERA STUDIO</text>

  <text x="48" y="125" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Laminate on Your Wall</text>
  <text x="48" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="url(#cyanGrad4)">Project 400+ Finishes via Mobile Camera</text>

  <g transform="translate(48, 205)">
    <circle cx="8" cy="8" r="4" fill="#38bdf8"/>
    <text x="22" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Point Camera at Bare Brick Wall, Wardrobe or Plywood Skelet</text>

    <circle cx="8" cy="38" r="4" fill="#fbbf24"/>
    <text x="22" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Drag 4-Corners, Adjust Opacity &amp; Check Natural Room Lighting</text>
  </g>

  <g transform="translate(48, 280)">
    <rect width="190" height="44" rx="22" fill="url(#cyanGrad4)"/>
    <text x="95" y="27" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="800" fill="#0d1117" text-anchor="middle">Launch AR Camera ➔</text>
  </g>

  <!-- Right Visual: Smartphone with AR Overlay & 4 Corner Pins -->
  <g transform="translate(580, 50)">
    <!-- Phone Body -->
    <rect x="10" y="10" width="140" height="250" rx="24" fill="#020617" stroke="#334155" stroke-width="4"/>
    <rect x="20" y="25" width="120" height="220" rx="16" fill="url(#screenGrad)"/>

    <!-- Screen Content: AR camera preview with projected laminate texture -->
    <!-- Simulated Wall Background -->
    <rect x="20" y="25" width="120" height="220" rx="16" fill="#1e293b"/>
    <!-- Projected Laminate Quad -->
    <polygon points="35,65 125,50 120,180 30,195" fill="#78350f" opacity="0.9" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="45" y1="63" x2="40" y2="193" stroke="#b45309" stroke-width="2"/>
    <line x1="75" y1="58" x2="70" y2="188" stroke="#92400e" stroke-width="2"/>
    <line x1="105" y1="53" x2="100" y2="183" stroke="#b45309" stroke-width="2"/>

    <!-- 4 Draggable Pin Handles -->
    <circle cx="35" cy="65" r="6" fill="#fbbf24" stroke="#0d1117" stroke-width="2"/>
    <circle cx="125" cy="50" r="6" fill="#fbbf24" stroke="#0d1117" stroke-width="2"/>
    <circle cx="120" cy="180" r="6" fill="#fbbf24" stroke="#0d1117" stroke-width="2"/>
    <circle cx="30" cy="195" r="6" fill="#fbbf24" stroke="#0d1117" stroke-width="2"/>

    <!-- Camera Reticle / Target Center -->
    <circle cx="78" cy="120" r="12" fill="none" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <circle cx="78" cy="120" r="2" fill="#38bdf8"/>

    <!-- Phone Speaker Bar & Notch -->
    <rect x="60" y="16" width="40" height="4" rx="2" fill="#475569"/>
    <!-- Bottom Floating AR Badge -->
    <rect x="30" y="210" width="100" height="20" rx="10" fill="rgba(15,23,42,0.85)" stroke="rgba(56,189,248,0.5)" stroke-width="1"/>
    <text x="80" y="223" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="8" font-weight="800" fill="#38bdf8" text-anchor="middle">WebAR Real-time</text>
  </g>
</svg>
