<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#1e1833"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="marbleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="fluteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" fill="url(#bgGrad2)"/>
  <rect width="800" height="360" rx="20" fill="none" stroke="rgba(251, 191, 36, 0.3)" stroke-width="2"/>

  <!-- Geometric accent lines -->
  <g opacity="0.1" stroke="#ec4899" stroke-width="1.5">
    <circle cx="720" cy="180" r="150" fill="none"/>
    <circle cx="720" cy="180" r="100" fill="none"/>
    <line x1="450" y1="0" x2="800" y2="350"/>
  </g>

  <circle cx="680" cy="140" r="140" fill="url(#goldGrad2)" opacity="0.1" filter="url(#glow2)"/>

  <!-- Content Column -->
  <rect x="48" y="44" width="220" height="32" rx="16" fill="linear-gradient(90deg, #ec4899, #8b5cf6)"/>
  <text x="158" y="65" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">🎨 2026 DESIGNER MICA</text>

  <text x="48" y="125" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Luxury Sunmica &amp; Louvers</text>
  <text x="48" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="url(#goldGrad2)">400+ Zero-Fingerprint Matt &amp; Gloss Finishes</text>

  <g transform="translate(48, 205)">
    <circle cx="8" cy="8" r="4" fill="#fbbf24"/>
    <text x="22" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">1.0mm Acrylic, Wooden Texture &amp; Italian Carrara Marble</text>

    <circle cx="8" cy="38" r="4" fill="#10b981"/>
    <text x="22" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Seamless 3D Charcoal &amp; Fluted Louver Panels In-Stock</text>
  </g>

  <g transform="translate(48, 280)">
    <rect width="180" height="44" rx="22" fill="url(#goldGrad2)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="800" fill="#0d1117" text-anchor="middle">Explore Laminates →</text>
  </g>

  <!-- Right Visual: Laminate Swatch Deck & Louver Panel -->
  <g transform="translate(570, 75)">
    <!-- Fluted Louver Panel Strip (Behind) -->
    <g transform="translate(-40, 20)">
      <rect x="0" y="0" width="18" height="200" rx="4" fill="url(#fluteGrad)" stroke="#b45309"/>
      <rect x="22" y="0" width="18" height="200" rx="4" fill="url(#fluteGrad)" stroke="#b45309"/>
      <rect x="44" y="0" width="18" height="200" rx="4" fill="url(#fluteGrad)" stroke="#b45309"/>
      <rect x="66" y="0" width="18" height="200" rx="4" fill="url(#fluteGrad)" stroke="#b45309"/>
      <rect x="88" y="0" width="18" height="200" rx="4" fill="url(#fluteGrad)" stroke="#b45309"/>
    </g>

    <!-- Swatch 1: Italian Marble -->
    <g transform="translate(20, 30) rotate(-12)">
      <rect width="110" height="170" rx="12" fill="url(#marbleGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="2" filter="url(#glow2)"/>
      <!-- Marble Veins -->
      <path d="M15,20 Q40,60 25,100 T60,150" fill="none" stroke="#94a3b8" stroke-width="2" opacity="0.6"/>
      <path d="M70,10 Q85,50 65,90 T90,140" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.5"/>
      <rect x="15" y="135" width="80" height="22" rx="4" fill="rgba(15,23,42,0.7)"/>
      <text x="55" y="150" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">Carrara Statuario</text>
    </g>

    <!-- Swatch 2: Royal Burma Teak -->
    <g transform="translate(60, 50) rotate(14)">
      <rect width="110" height="170" rx="12" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
      <path d="M10,0 Q30,85 10,170" fill="none" stroke="#451a03" stroke-width="4" opacity="0.5"/>
      <path d="M50,0 Q30,85 50,170" fill="none" stroke="#b45309" stroke-width="3" opacity="0.6"/>
      <path d="M90,0 Q70,85 90,170" fill="none" stroke="#92400e" stroke-width="3" opacity="0.5"/>
      <rect x="15" y="135" width="80" height="22" rx="4" fill="rgba(15,23,42,0.7)"/>
      <text x="55" y="150" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle">Royal Burma Teak</text>
    </g>
  </g>
</svg>
