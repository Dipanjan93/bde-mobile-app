<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190e06"/>
      <stop offset="50%" stop-color="#2a1708"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="amberGrad5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="360" rx="20" fill="url(#bgGrad5)"/>
  <rect width="800" height="360" rx="20" fill="none" stroke="rgba(249, 115, 22, 0.35)" stroke-width="2"/>

  <!-- Geometric carpentry lines -->
  <g opacity="0.08" stroke="#fbbf24" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <circle cx="680" cy="180" r="140" fill="none"/>
  </g>

  <circle cx="680" cy="140" r="140" fill="url(#amberGrad5)" opacity="0.12" filter="url(#glow5)"/>

  <!-- Left Content Column -->
  <rect x="48" y="44" width="220" height="32" rx="16" fill="linear-gradient(90deg, #ea580c, #d97706)"/>
  <text x="158" y="65" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">🪚 VERIFIED CARPENTERS</text>

  <text x="48" y="125" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Find Trusted Onda Mistris</text>
  <text x="48" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="url(#amberGrad5)">150+ Verified Carpenters in Bankura District</text>

  <g transform="translate(48, 205)">
    <circle cx="8" cy="8" r="4" fill="#10b981"/>
    <text x="22" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Specialists in Sliding Wardrobes, Modular Kitchen &amp; CNC Paneling</text>

    <circle cx="8" cy="38" r="4" fill="#fbbf24"/>
    <text x="22" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">100% Free Direct Calling • Zero Brokerage or Commission</text>
  </g>

  <g transform="translate(48, 280)">
    <rect width="180" height="44" rx="22" fill="url(#amberGrad5)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="800" fill="#0d1117" text-anchor="middle">Find Mistri →</text>
  </g>

  <!-- Right Visual: Carpenter Badge & Workshop Tools Graphic -->
  <g transform="translate(560, 80)">
    <!-- Shield Container -->
    <path d="M100,10 L190,50 L190,140 Q190,210 100,240 Q10,210 10,140 L10,50 Z" fill="rgba(22,27,34,0.9)" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow5)"/>
    
    <!-- Verified Ribbon -->
    <rect x="50" y="180" width="100" height="24" rx="12" fill="#10b981"/>
    <text x="100" y="196" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓ BDE VERIFIED</text>

    <!-- Star Ratings -->
    <text x="100" y="160" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="16" fill="#fbbf24" text-anchor="middle">★★★★★</text>
    <text x="100" y="135" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="800" fill="#e2e8f0" text-anchor="middle">4.9 / 5.0 Rating</text>

    <!-- Center Icon: Saw & Hammer -->
    <text x="100" y="90" font-size="44" text-anchor="middle">🪚</text>
  </g>
</svg>
