<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091410"/>
      <stop offset="50%" stop-color="#0f261c"/>
      <stop offset="100%" stop-color="#1b1d28"/>
    </linearGradient>
    <linearGradient id="greenGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="360" rx="20" fill="url(#bgGrad3)"/>
  <rect width="800" height="360" rx="20" fill="none" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2"/>

  <!-- Subtle circles pattern -->
  <g opacity="0.08" stroke="#10b981" stroke-width="2">
    <circle cx="680" cy="180" r="160" fill="none"/>
    <circle cx="680" cy="180" r="110" fill="none"/>
    <circle cx="680" cy="180" r="60" fill="none"/>
  </g>

  <circle cx="680" cy="140" r="140" fill="url(#greenGrad3)" opacity="0.12" filter="url(#glow3)"/>

  <!-- Left Content Column -->
  <rect x="48" y="44" width="220" height="32" rx="16" fill="linear-gradient(90deg, #059669, #0d9488)"/>
  <text x="158" y="65" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">🧴 PIDILITE OFFICIAL HUB</text>

  <text x="48" y="125" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Fevicol Contractor Packs</text>
  <text x="48" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="url(#greenGrad3)">Marine, HeatX &amp; SH Fresh Depot Stock</text>

  <g transform="translate(48, 205)">
    <circle cx="8" cy="8" r="4" fill="#34d399"/>
    <text x="22" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">1kg, 5kg, 10kg, 20kg &amp; 50kg Heavy Contractor Pails</text>

    <circle cx="8" cy="38" r="4" fill="#fbbf24"/>
    <text x="22" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Earn Instant Carpenter Counter Points &amp; Direct Cashback</text>
  </g>

  <g transform="translate(48, 280)">
    <rect width="180" height="44" rx="22" fill="url(#greenGrad3)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="800" fill="#0d1117" text-anchor="middle">Order Adhesives →</text>
  </g>

  <!-- Right Visual: 3D Adhesive Pail & Tub -->
  <g transform="translate(560, 90)">
    <!-- Shadow -->
    <ellipse cx="100" cy="205" rx="90" ry="20" fill="#000000" opacity="0.5"/>

    <!-- 50kg Pail (Left/Behind) -->
    <g transform="translate(10, 20)">
      <path d="M10,40 L90,40 L82,170 L18,170 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="50" cy="40" rx="40" ry="12" fill="#38bdf8"/>
      <ellipse cx="50" cy="170" rx="32" ry="8" fill="#0369a1"/>
      <ellipse cx="50" cy="36" rx="38" ry="10" fill="#ffffff"/>
      <!-- Label on Pail -->
      <rect x="22" y="70" width="56" height="50" rx="4" fill="#ffffff"/>
      <rect x="22" y="70" width="56" height="14" fill="#fbbf24"/>
      <text x="50" y="81" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="8" font-weight="900" fill="#1e1b4b" text-anchor="middle">FEVICOL</text>
      <text x="50" y="98" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="900" fill="#0284c7" text-anchor="middle">MARINE</text>
      <text x="50" y="112" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="7" font-weight="800" fill="#475569" text-anchor="middle">50 KG PAIL</text>
      <!-- Handle -->
      <path d="M10,48 Q-10,100 18,130" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    </g>

    <!-- Fevicol HeatX Tub (Front Right) -->
    <g transform="translate(80, 70)">
      <path d="M10,35 L90,35 L82,130 L18,130 Z" fill="#ea580c" stroke="#fb923c" stroke-width="1.5"/>
      <ellipse cx="50" cy="35" rx="40" ry="10" fill="#f97316"/>
      <ellipse cx="50" cy="130" rx="32" ry="6" fill="#c2410c"/>
      <ellipse cx="50" cy="31" rx="38" ry="8" fill="#fef08a"/>
      <!-- Label -->
      <rect x="22" y="55" width="56" height="42" rx="4" fill="#ffffff"/>
      <text x="50" y="70" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="9" font-weight="900" fill="#ea580c" text-anchor="middle">HEATX</text>
      <text x="50" y="85" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="7" font-weight="800" fill="#1f2937" text-anchor="middle">Fast Setting</text>
    </g>
  </g>
</svg>
