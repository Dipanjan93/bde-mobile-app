import java.util.Properties
import java.io.FileInputStream

plugins {
    id 'com.android.application'
}

// Safely load local key.properties if present (ignored by Git)
def keyPropertiesFile = rootProject.file("key.properties")
if (!keyPropertiesFile.exists()) {
    keyPropertiesFile = file("key.properties")
}
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

// Read from Environment variable first, fallback to key.properties
def getSigningProperty(String envVar, String propName, Properties props) {
    def envVal = System.getenv(envVar)
    if (envVal != null && !envVal.trim().isEmpty()) {
        return envVal.trim()
    }
    if (props != null && props.getProperty(propName) != null && !props.getProperty(propName).trim().isEmpty()) {
        return props.getProperty(propName).trim()
    }
    return null
}

android {
    namespace 'com.babadugdheswarenterprise.bde'
    compileSdk 34

    defaultConfig {
        applicationId "com.babadugdheswarenterprise.bde"
        minSdk 21
        targetSdk 34
        versionCode 101
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksPath = getSigningProperty("KEYSTORE_FILE", "keystoreFile", keyProperties)
            def sPass = getSigningProperty("KEYSTORE_PASSWORD", "keystorePassword", keyProperties)
            def kAlias = getSigningProperty("KEY_ALIAS", "keyAlias", keyProperties)
            def kPass = getSigningProperty("KEY_PASSWORD", "keyPassword", keyProperties)

            // Resolve keystore file if provided or if local file exists
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
            } else if (file('my-release-key.jks').exists()) {
                storeFile file('my-release-key.jks')
            }

            if (sPass != null) storePassword sPass
            if (kAlias != null) keyAlias kAlias
            if (kPass != null) keyPassword kPass
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storePassword != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
