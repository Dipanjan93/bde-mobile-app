<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#241a0d"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="badgeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="360" rx="20" fill="url(#bgGrad1)"/>
  <rect width="800" height="360" rx="20" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2"/>

  <!-- Subtle Timber Grain & Geometric Pattern -->
  <g opacity="0.08" stroke="#fbbf24" stroke-width="1.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <circle cx="680" cy="180" r="140" fill="none" stroke-width="2"/>
    <circle cx="680" cy="180" r="90" fill="none" stroke-width="2"/>
    <circle cx="680" cy="180" r="40" fill="none" stroke-width="2"/>
  </g>

  <!-- Decorative Light Orb -->
  <circle cx="700" cy="120" r="160" fill="url(#goldGrad1)" opacity="0.12" filter="url(#glow1)"/>

  <!-- Left Content Column -->
  <!-- Festive Pill Badge -->
  <rect x="48" y="44" width="200" height="32" rx="16" fill="url(#badgeGrad1)"/>
  <text x="148" y="65" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">⚡ FESTIVE MEGA DEALS</text>

  <!-- Title -->
  <text x="48" y="125" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">IS:710 Marine &amp; BWR Plywood</text>
  <text x="48" y="165" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="24" font-weight="800" fill="url(#goldGrad1)">100% Calibrated Gurjan Core Depot Stock</text>

  <!-- Subtitle / Highlights -->
  <g transform="translate(48, 205)">
    <circle cx="8" cy="8" r="4" fill="#10b981"/>
    <text x="22" y="12" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Borer &amp; Termite Proof with 25-Year Showroom Warranty</text>

    <circle cx="8" cy="38" r="4" fill="#fbbf24"/>
    <text x="22" y="42" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Direct Express Delivery across Onda, Punisole &amp; Bankura</text>
  </g>

  <!-- Call to action button visual -->
  <g transform="translate(48, 280)">
    <rect width="180" height="44" rx="22" fill="url(#goldGrad1)"/>
    <text x="90" y="27" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="14" font-weight="800" fill="#0d1117" text-anchor="middle">Browse Plywood →</text>
  </g>

  <!-- Right Graphic: 3D Stack of Calibrated Plywood Sheets -->
  <g transform="translate(560, 110)">
    <!-- Shadow -->
    <ellipse cx="90" cy="190" rx="100" ry="24" fill="#000000" opacity="0.45"/>
    
    <!-- Plywood Sheet 1 (Bottom) -->
    <path d="M10,130 L160,80 L200,110 L50,160 Z" fill="#78350f" stroke="#92400e" stroke-width="2"/>
    <path d="M10,130 L50,160 L50,172 L10,142 Z" fill="#451a03"/>
    <path d="M50,160 L200,110 L200,122 L50,172 Z" fill="#78350f"/>

    <!-- Plywood Sheet 2 (Middle) -->
    <path d="M10,105 L160,55 L200,85 L50,135 Z" fill="#92400e" stroke="#b45309" stroke-width="2"/>
    <path d="M10,105 L50,135 L50,117 L10,87 Z" fill="#78350f"/>
    <path d="M50,135 L200,85 L200,97 L50,147 Z" fill="#92400e"/>

    <!-- Plywood Sheet 3 (Top - Golden Polish) -->
    <path d="M10,80 L160,30 L200,60 L50,110 Z" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
    <path d="M10,80 L50,110 L50,92 L10,62 Z" fill="#92400e"/>
    <path d="M50,110 L200,60 L200,72 L50,122 Z" fill="#b45309"/>

    <!-- Stamp on top sheet -->
    <rect x="75" y="65" width="60" height="26" rx="4" fill="rgba(0,0,0,0.3)" stroke="#fef08a" stroke-width="1.5" transform="rotate(-18, 75, 65)"/>
    <text x="105" y="82" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="10" font-weight="900" fill="#fef08a" text-anchor="middle" transform="rotate(-18, 75, 65)">BDE IS:710</text>
  </g>
</svg>
