name: Build Android Release APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew || true
      working-directory: android_project

    - name: Build Release APK and Google Play AAB
      run: |
        gradle wrapper
        ./gradlew assembleRelease bundleRelease --stacktrace
      working-directory: android_project

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bde-store-release-apk
        path: android_project/app/build/outputs/apk/release/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: bde-store-release-aab
        path: android_project/app/build/outputs/bundle/release/*.aab
