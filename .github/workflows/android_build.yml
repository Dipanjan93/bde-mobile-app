name: Build Android Release APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK and Google Play AAB
      run: |
        cd android_project
        gradle :app:assembleRelease :app:bundleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bde-store-release-apk
        path: android_project/app/build/outputs/apk/release/*.apk

    - name: Upload Google Play AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: bde-store-release-aab
        path: android_project/app/build/outputs/bundle/release/*.aab
